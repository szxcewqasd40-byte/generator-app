name: Unzip and Build AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Source Code & Organize Files
        run: |
          mkdir -p temp_extracted
          unzip -o *.zip -d temp_extracted
          
          # البحث عن ملف gradlew ونقل כל المحتويات للمجلد الرئيسي
          GRADLEW_PATH=$(find temp_extracted -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
            cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi
          
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
